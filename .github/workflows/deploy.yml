name: Deploy Latest Main

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: telegram-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: telegram-bot-${{ github.run_id }}

      - run: aws sts get-caller-identity

      - run: bun install --frozen-lockfile
      - run: bun run audit
      - run: bun run biome
      - run: bun run tsc
      - run: bun test
      - run: bun run deploy
        env:
          SERVERLESS_ACCESS_KEY: ${{secrets.SERVERLESS_ACCESS_KEY}}
          TAVILY_API_KEY: ${{secrets.TAVILY_API_KEY}}
          GOOGLE_CX_TOKEN: ${{secrets.GOOGLE_CX_TOKEN}}
          COMMON_GOOGLE_API_KEY: ${{secrets.COMMON_GOOGLE_API_KEY}}
          OPEN_WEATHER_MAP_TOKEN: ${{secrets.OPEN_WEATHER_MAP_TOKEN}}
          TOKEN: ${{secrets.TOKEN}}
          TELEGRAM_WEBHOOK_SECRET: ${{secrets.TELEGRAM_WEBHOOK_SECRET}}
          YOUTUBE_TOKEN: ${{secrets.YOUTUBE_TOKEN}}
          FIXER_API_KEY: ${{secrets.FIXER_API_KEY}}
          EXCHANGE_RATE_API_KEY: ${{secrets.EXCHANGE_RATE_API_KEY}}
          OPENAI_API_KEY: ${{secrets.OPENAI_API_KEY}}
          AGENTIC_BOT_ENABLED: ${{vars.AGENTIC_BOT_ENABLED || 'true'}}
          BOT_OWNER_ID: ${{vars.BOT_OWNER_ID}}
          TELEGRAM_OIDC_CLIENT_ID: ${{vars.TELEGRAM_OIDC_CLIENT_ID}}
          ADMIN_SESSION_SECRET: ${{secrets.ADMIN_SESSION_SECRET}}
          WORKER_FAILURE_ALERT_EMAIL: ${{vars.WORKER_FAILURE_ALERT_EMAIL || 'ddrrai@gmail.com'}}
          UPSTASH_REDIS_URL: ${{secrets.UPSTASH_REDIS_URL}}
          UPSTASH_REDIS_TOKEN: ${{secrets.UPSTASH_REDIS_TOKEN}}
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
          GIPHY_API_KEY: ${{secrets.GIPHY_API_KEY}}
