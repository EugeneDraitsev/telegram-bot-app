Resources:
  TelegramReplyWorkerDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.replyWorkerDlqName}
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  TelegramReplyWorkerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.replyWorkerQueueName}
      FifoQueue: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 1800
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - TelegramReplyWorkerDlq
            - Arn
        maxReceiveCount: 5

  TelegramAgentWorkerDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.agentWorkerDlqName}
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  TelegramAgentWorkerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.agentWorkerQueueName}
      FifoQueue: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 1800
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - TelegramAgentWorkerDlq
            - Arn
        maxReceiveCount: 5

  TelegramActivityWorkerDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.activityWorkerDlqName}
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  TelegramActivityWorkerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:custom.activityWorkerQueueName}
      FifoQueue: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - TelegramActivityWorkerDlq
            - Arn
        maxReceiveCount: 5

  WorkerFailureAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ${self:service}-${sls:stage}-worker-failure-alerts
      Subscription:
        - Protocol: email
          Endpoint: ${self:custom.workerFailureAlertEmail}

  TelegramReplyWorkerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:service}-${sls:stage}-reply-worker-dlq-over-3
      AlarmDescription: Reply worker DLQ contains more than 3 visible messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - TelegramReplyWorkerDlq
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: WorkerFailureAlertsTopic

  TelegramAgentWorkerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:service}-${sls:stage}-agent-worker-dlq-over-3
      AlarmDescription: Agent worker DLQ contains more than 3 visible messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - TelegramAgentWorkerDlq
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: WorkerFailureAlertsTopic

  TelegramActivityWorkerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:service}-${sls:stage}-activity-worker-dlq-over-3
      AlarmDescription: Activity worker DLQ contains more than 3 visible messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - TelegramActivityWorkerDlq
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: WorkerFailureAlertsTopic

  ChatWebsocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:custom.websocketConnectionsTableName}
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: chatId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ${self:custom.websocketConnectionsChatIdIndexName}
          KeySchema:
            - AttributeName: chatId
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ChatEventsTable:
    Type: AWS::DynamoDB::Table
    # Intentionally no TimeToLiveSpecification: chat event records are
    # permanent. The application-level ttl attribute does not expire items
    # unless DynamoDB TTL is explicitly enabled for this table.
    Properties:
      TableName: ${self:custom.chatEventsTableName}
      AttributeDefinitions:
        - AttributeName: chatId
          AttributeType: S
        - AttributeName: date
          AttributeType: N
      KeySchema:
        - AttributeName: chatId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  ChatUserStatisticsTable:
    Type: AWS::DynamoDB::Table
    # Aggregate chat statistics are permanent: current writes intentionally
    # omit the ttl attribute. DynamoDB TTL only affects items that contain it.
    Properties:
      TableName: ${self:custom.chatUserStatisticsTableName}
      AttributeDefinitions:
        - AttributeName: chatId
          AttributeType: S
        - AttributeName: userId
          AttributeType: N
      KeySchema:
        - AttributeName: chatId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ChatConfigurationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ${self:custom.chatConfigurationTableName}
      AttributeDefinitions:
        - AttributeName: chatId
          AttributeType: S
      KeySchema:
        - AttributeName: chatId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: application
          Value: telegram
        - Key: data-class
          Value: permanent-configuration
        - Key: managed-by
          Value: cloudformation

  WebsocketBroadcastStatsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: websocket-broadcast-stats
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:TagResource
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource:
                  - Fn::Join:
                      - ''
                      - - 'arn:aws:execute-api:'
                        - Ref: AWS::Region
                        - ':'
                        - Ref: AWS::AccountId
                        - ':'
                        - Ref: WebsocketsApi
                        - /${sls:stage}/POST/@connections/*
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:*:*:table/${self:custom.chatUserStatisticsTableName}
                  - arn:aws:dynamodb:*:*:table/${self:custom.chatEventsTableName}
                  - arn:aws:dynamodb:*:*:table/${self:custom.websocketConnectionsTableName}/index/${self:custom.websocketConnectionsChatIdIndexName}
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                Resource:
                  - arn:aws:dynamodb:*:*:table/${self:custom.websocketConnectionsTableName}

Outputs:
  WorkerFailureAlertsTopicArn:
    Value:
      Ref: WorkerFailureAlertsTopic
  TelegramReplyWorkerQueueUrl:
    Value:
      Ref: TelegramReplyWorkerQueue
  TelegramAgentWorkerQueueUrl:
    Value:
      Ref: TelegramAgentWorkerQueue
  TelegramActivityWorkerQueueUrl:
    Value:
      Ref: TelegramActivityWorkerQueue
